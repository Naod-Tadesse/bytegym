server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite fingerprints these filenames, so a year is safe: a changed file is a
  # changed URL.
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: TanStack Router owns every path, so a deep link like
  # /members/<id>/sell must return index.html rather than 404.
  #
  # index.html itself is never cached. It names the hashed bundles, so a cached
  # copy pins a browser to the previous deploy indefinitely.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
