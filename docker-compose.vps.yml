# The deployed stack: a one-shot migrator, the API, and the SPA.
#
#   docker compose -f docker-compose.vps.yml up --build -d
#
# THE DATABASE IS NOT HERE. Postgres is a Coolify-managed service, created and
# backed up outside this file, and reached over the network below. Nothing in
# this stack owns the data, so redeploying — or deleting the whole stack —
# cannot destroy it.
#
# Every value comes from the environment (`KEY=${KEY}`), so nothing secret is in
# this file or in the image. Put them in Coolify's Shared Variables at project
# scope and one edit covers every service.
#
# `docker-compose.yml` is still the LOCAL development database, unrelated to
# this file. It is only used by `nx run @org/backend:db-up`.

services:
  # ============ Schema and catalogues ============
  #
  # Runs once per deploy and exits. Migrations, then the seed — which is what
  # creates the permission catalogue, the job titles and the first admin. A
  # fresh database without it has no permissions at all and nobody can sign in.
  #
  # Built from the `builder` stage because drizzle-kit and tsx are devDeps: the
  # production image deliberately has neither. Both commands are idempotent, so
  # re-running a deploy is safe.
  #
  # There is no `depends_on` for the database any more. The Coolify Postgres
  # service has its own lifecycle and is already running before this stack
  # deploys; if it is not, this container fails and the API never starts, which
  # is the correct order of events.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: ${DOCKER_REGISTRY:-}bytegym-migrate:${IMAGE_TAG:-latest}
    container_name: bytegym-migrate
    restart: 'no'
    command:
      - sh
      - -c
      - npx nx run @org/backend:db-migrate && npx nx run @org/backend:db-seed
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PHONE=${ADMIN_PHONE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - bytegym
      - coolify

  # ============ API ============
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-}bytegym-api:${IMAGE_TAG:-latest}
    container_name: bytegym-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      # Points at the Coolify Postgres service, so the host is that service's
      # name on the shared network — never `localhost`, and never a container
      # this file defines.
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:?generate with openssl rand -hex 32}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?generate a second, different one}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      # The browser's origin for the SPA. Also gates the WebSocket handshake —
      # the gateway reads this same list, so a missing origin breaks live
      # updates silently while the REST API keeps working.
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Unset means nothing is ever texted; messages go to the log instead.
      - SMS_PROVIDER=${SMS_PROVIDER:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_BASE_URL=${SMS_BASE_URL:-}
      # Defaults to the test handset even when unset. Set it to `all` only when
      # the gym is ready to text real members.
      - SMS_ALLOWED_RECIPIENTS=${SMS_ALLOWED_RECIPIENTS:-}
      # The spec enumerates every route and permission name, so it is off unless
      # asked for.
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
    # The browser dials the API directly, so it needs a public address. Under
    # Coolify give this service its own domain and let the proxy reach it on the
    # `coolify` network; the published port is what makes it work on a plain VPS
    # too. Drop `ports:` entirely if the proxy is the only way in.
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - bytegym
      - coolify

  # ============ SPA ============
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Compiled into the bundle, so changing it needs a rebuild, not a
        # restart. It must be the API's public address — the browser and the
        # socket both dial it directly.
        VITE_BASE_URL: ${VITE_BASE_URL}
    image: ${DOCKER_REGISTRY:-}bytegym-web:${IMAGE_TAG:-latest}
    container_name: bytegym-web
    restart: unless-stopped
    # Exposed to the proxy rather than published to the host: Coolify terminates
    # TLS and routes the domain to this port. On a plain VPS, swap this for
    # `ports: ['${WEB_PORT:-8080}:80']`.
    expose:
      - '80'
    depends_on:
      api:
        condition: service_started
    networks:
      - bytegym
      - coolify

# No volumes. The only durable state is the database, and Coolify owns it.

networks:
  # Private to this stack: api <-> web <-> migrate.
  bytegym:
    driver: bridge
  # Coolify's shared network — how these containers reach the managed Postgres,
  # and how its proxy reaches the SPA. The Postgres service must have "Connect
  # To Predefined Network" enabled for the hostname in DATABASE_URL to resolve.
  #
  # If instead the database sits on its own per-service network, add that one
  # here as well and attach `api` and `migrate` to it:
  #
  #   postgres-net:
  #     external: true
  #     name: <the service network name Coolify shows>
  coolify:
    external: true
    name: coolify
